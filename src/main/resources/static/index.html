<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibitipoca · Navegação Offline</title>

    <link rel="stylesheet" href="./leaflet/leaflet.css">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/map.css">
</head>

<body>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <header class="brand">
            <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <!-- sol -->
                    <circle cx="23" cy="9.5" r="3.2" fill="#fde68a"/>
                    <!-- montanha de trás -->
                    <path d="M3 25 L12 11 L18 20 L15 25 Z"
                          fill="rgba(255,255,255,0.55)"/>
                    <!-- montanha da frente com pico nevado -->
                    <path d="M11 25 L19 12 L29 25 Z" fill="#ffffff"/>
                    <path d="M19 12 L22.4 16.5 L21 17.3 L19.7 16.3
                             L18.3 17.5 L15.6 16.5 Z"
                          fill="rgba(91,140,255,0.45)"/>
                </svg>
            </span>
            <div>
                <h1 class="brand__title">Ibitipoca</h1>
                <p class="brand__subtitle">Navegação offline</p>
            </div>
            <button type="button" class="brand__toggle" id="btn-toggle"
                    title="Expandir/recolher" aria-label="Expandir ou recolher">
                ☰
            </button>
        </header>

        <section class="stats">
            <article class="stat">
                <span class="stat__label">Conexão</span>
                <span class="stat__value" id="conexao">
                    <span class="dot" id="conexao-dot"></span>Verificando
                </span>
            </article>
            <article class="stat">
                <span class="stat__label">Distância</span>
                <span class="stat__value" id="distancia">—</span>
            </article>
            <article class="stat">
                <span class="stat__label">Tempo estimado</span>
                <span class="stat__value" id="tempo">—</span>
            </article>
            <article class="stat">
                <span class="stat__label">GPS</span>
                <span class="stat__value" id="gps">Não iniciado</span>
            </article>
        </section>

        <div class="status" id="status" role="status" aria-live="polite">
            Inicializando o mapa…
        </div>

        <div class="actions">
            <button type="button" class="btn" id="btn-gps">
                <span aria-hidden="true">📍</span> Localização
            </button>
            <button type="button" class="btn" id="btn-sim">
                <span aria-hidden="true">▶</span> Simular
            </button>
            <button type="button" class="btn btn--ghost" id="btn-tema"
                    title="Alternar tema" aria-label="Alternar tema">
                🌓
            </button>
        </div>

        <section class="steps" id="steps-wrap" hidden>
            <h2 class="steps__title">Instruções da rota</h2>
            <ol class="steps__list" id="steps-list"></ol>
        </section>

        <p class="note">
            A linha destaca o trajeto armazenado localmente. Clique em uma
            instrução para centralizar no mapa. GPS funciona sem internet.
        </p>
    </aside>

    <div class="resizer" id="resizer" role="separator"
         aria-orientation="vertical" tabindex="0"
         aria-label="Redimensionar painel lateral"></div>

    <main class="map-wrap">
        <div id="mapa"></div>
    </main>
</div>

<script src="./leaflet/leaflet.js"></script>
<script src="./js/config.js"></script>
<script src="./js/util.js"></script>
<script src="./js/map.js"></script>
<script src="./js/route.js"></script>
<script src="./js/gps.js"></script>
<script src="./js/simulation.js"></script>
<script src="./js/theme.js"></script>
<script src="./js/sidebar.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
